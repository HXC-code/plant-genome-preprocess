name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/pyproject.toml
      - name: Install package and checks
        run: python -m pip install -e ".[test]" ruff mypy
      - name: pytest
        run: python -m pytest -q
      - name: ruff
        run: python -m ruff check src tests scripts tools
      - name: mypy
        run: python -m mypy src --ignore-missing-imports
