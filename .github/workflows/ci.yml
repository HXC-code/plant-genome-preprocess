name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: code/pyproject.toml
      - name: Install package and checks
        run: python -m pip install -e ".[test]" ruff mypy
      - name: pytest
        run: python -m pytest -q
      - name: ruff
        run: python -m ruff check src tests scripts tools
      - name: mypy
        run: python -m mypy src --ignore-missing-imports
      - name: Shell syntax
        shell: bash
        working-directory: .
        run: |
          for script in *.sh code/tools/*.sh; do
            bash -n "$script"
          done

  wgdi-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linux bioinformatics tools
        run: |
          sudo apt-get update
          sudo apt-get install -y diamond-aligner muscle paml
      - name: Install pinned WGDI runtime
        run: python -m pip install -r requirements-wgdi-validated.txt
      - name: Install PAL2NAL from official source
        run: python code/tools/install_pal2nal.py
      - name: Build and run full Linux smoke
        run: |
          bash bin/wgdi --help >/dev/null
          python -c "import wgdi; print('wgdi import OK')"
          python code/tools/build_synthetic_wgdi_smoke.py \
            --workflow-root "$PWD" --output-root "$RUNNER_TEMP/smoke" \
            --genes-per-species 120 --chromosomes 8 --protein-length 80
          bash code/tools/run_wgdi_smoke.sh "$RUNNER_TEMP/smoke"
      - name: Upload Linux smoke receipt
        uses: actions/upload-artifact@v4
        with:
          name: linux-smoke-receipt
          path: ${{ runner.temp }}/smoke/smoke_report.public.json
          if-no-files-found: error
